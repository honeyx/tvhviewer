name: Build and Package Binaries

on:
  push:
    tags:
      - '*'  # Trigger on tag pushes, for versioning

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: write  # needed so the workflow can attach build artifacts to the release

jobs:
  build:
    strategy:
      fail-fast: false  # one platform failing shouldn't cancel the others
      matrix:
        os: [macos-13, macos-14, windows-latest, ubuntu-latest]
        include:
          - os: macos-13
            arch: x86_64  # macOS Intel
            artifact_name: tvhviewer-macos-intel-x86
          - os: macos-14
            arch: arm64  # macOS ARM64 (M1/M2)
            artifact_name: tvhviewer-macos-arm64
          - os: windows-latest
            arch: amd64
            artifact_name: tvhviewer-windows
          - os: ubuntu-latest
            arch: amd64
            artifact_name: tvhviewer-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 python-vlc requests urllib3 pillow pyinstaller
        shell: bash

      # --- Windows: build as a folder (--onedir), not a single --onefile
      # exe. --onefile extracts everything to a temp folder at every
      # startup, which repeatedly broke Qt's platform-plugin loading.
      # --onedir keeps the exe and all DLLs sitting right next to each
      # other on disk - the setup PyInstaller itself recommends for Qt
      # apps - and sidesteps that whole class of problem.
      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          # NOTE: --windowed is intentionally left off right now (temporary
          # debug build) so a console window stays open and shows Qt's
          # real diagnostic output (QT_DEBUG_PLUGINS=1, set in the app
          # itself) instead of just a generic "failed to start" dialog.
          # Put --windowed back once the underlying issue is fixed.
          pyinstaller --onedir --name=${{ matrix.artifact_name }} `
            --add-data "icons;icons" `
            --collect-all PyQt5 `
            tvhplayer/tvhplayer.py
        shell: pwsh

      - name: Copy Qt runtime DLLs next to the exe (Windows)
        if: runner.os == 'Windows'
        run: |
          # qwindows.dll (the Qt platform plugin) was being *found* but
          # failing to *load* - almost always because DLLs it depends on
          # (Qt5Core/Qt5Gui/the ANGLE OpenGL translation libs) end up
          # nested under a different folder than --collect-all placed it
          # in, so Windows' DLL search never finds them. Copying every
          # PyQt5 Qt5 runtime DLL directly next to the .exe (the first
          # place Windows always looks) sidesteps that entirely.
          $pyqt5_bin = python -c "import PyQt5, os; print(os.path.join(os.path.dirname(PyQt5.__file__), 'Qt5', 'bin'))"
          Copy-Item "$pyqt5_bin\*.dll" -Destination "dist/${{ matrix.artifact_name }}/" -Force
          $platforms_src = "dist/${{ matrix.artifact_name }}/_internal/PyQt5/Qt5/plugins/platforms"
          $platforms_dst = "dist/${{ matrix.artifact_name }}/platforms"
          if (Test-Path $platforms_src) {
            New-Item -ItemType Directory -Force -Path $platforms_dst | Out-Null
            Copy-Item "$platforms_src\*" -Destination $platforms_dst -Force
          }
        shell: pwsh

      - name: Zip Windows build folder
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "dist/${{ matrix.artifact_name }}/*" -DestinationPath "dist/${{ matrix.artifact_name }}-${{ github.ref_name }}-windows.zip"
        shell: pwsh

      - name: Build executable (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --windowed --name=${{ matrix.artifact_name }} \
            --add-data "icons:icons" \
            --collect-all PyQt5 \
            tvhplayer/tvhplayer.py
        shell: bash

      # --- Linux: also build a real installable .deb package (small,
      # relies on system-installed PyQt5/VLC via apt, instead of bundling
      # everything like the portable PyInstaller binary above).
      - name: Build real AppImage (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp "dist/${{ matrix.artifact_name }}" AppDir/usr/bin/tvhviewer
          chmod +x AppDir/usr/bin/tvhviewer
          cp tvhplayer.png AppDir/tvhviewer.png

          cat > AppDir/tvhviewer.desktop << 'EOF'
          [Desktop Entry]
          Name=TVHviewer
          Comment=More modern desktop client for Tvheadend. Watch and record live TV
          Exec=tvhviewer
          Icon=tvhviewer
          Terminal=false
          Type=Application
          Categories=AudioVideo;Player;TV;
          EOF

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/tvhviewer" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          # GitHub's runners don't have FUSE, so extract-and-run instead
          ./appimagetool --appimage-extract-and-run AppDir "tvhviewer-${{ github.ref_name }}-x86_64.AppImage"
        shell: bash

      - name: Build .deb package (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          python3 - << 'PYEOF'
          import os, stat, re

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          root = "pkgroot"

          dirs = [
              f"{root}/usr/lib/python3/dist-packages/tvhplayer",
              f"{root}/usr/bin",
              f"{root}/usr/share/applications",
              f"{root}/usr/share/icons/hicolor/256x256/apps",
              f"{root}/usr/share/icons/tvhplayer",
              f"{root}/DEBIAN",
          ]
          for d in dirs:
              os.makedirs(d, exist_ok=True)

          import shutil
          shutil.copy("tvhplayer/__init__.py", f"{root}/usr/lib/python3/dist-packages/tvhplayer/")
          shutil.copy("tvhplayer/tvhplayer.py", f"{root}/usr/lib/python3/dist-packages/tvhplayer/")
          for fn in os.listdir("icons"):
              if fn.endswith((".svg", ".png")):
                  shutil.copy(f"icons/{fn}", f"{root}/usr/share/icons/tvhplayer/{fn}")
          shutil.copy("tvhplayer.png", f"{root}/usr/share/icons/hicolor/256x256/apps/tvhviewer.png")
          shutil.copy("tvhplayer.png", f"{root}/usr/share/icons/tvhplayer/tvhviewer.png")

          launcher = f"{root}/usr/bin/tvhviewer"
          with open(launcher, "w") as f:
              f.write(
                  "#!/usr/bin/env python3\n"
                  "import sys\n"
                  "sys.path.insert(0, '/usr/lib/python3/dist-packages')\n"
                  "from tvhplayer.tvhplayer import main\n"
                  "if __name__ == '__main__':\n"
                  "    main()\n"
              )
          st = os.stat(launcher)
          os.chmod(launcher, st.st_mode | stat.S_IEXEC | stat.S_IXGRP | stat.S_IXOTH)

          with open(f"{root}/usr/share/applications/tvhviewer.desktop", "w") as f:
              f.write(
                  "[Desktop Entry]\n"
                  "Name=TVHviewer\n"
                  "Comment=More modern desktop client for Tvheadend. Watch and record live TV\n"
                  "Exec=/usr/bin/tvhviewer\n"
                  "Icon=tvhviewer\n"
                  "Terminal=false\n"
                  "Type=Application\n"
                  "Categories=AudioVideo;Player;TV;\n"
              )

          with open(f"{root}/DEBIAN/control", "w") as f:
              f.write(
                  f"Package: tvhviewer\n"
                  f"Version: {version}\n"
                  f"Section: video\n"
                  f"Priority: optional\n"
                  f"Architecture: all\n"
                  f"Depends: python3 (>= 3.8), python3-pyqt5, python3-vlc, vlc, python3-requests, python3-urllib3, python3-pil\n"
                  f"Maintainer: honeyx <noreply@example.com>\n"
                  f"Description: More modern desktop client for Tvheadend\n"
                  f" Watch and record live TV. TVHviewer is a fork of TVHplayer,\n"
                  f" originally created by mFat (https://github.com/mfat/tvhplayer).\n"
                  f" Features a dark/light theme, a full multi-channel EPG grid with\n"
                  f" timeline and newspaper views, favorites, and local recording.\n"
              )
          PYEOF

          find pkgroot -type d -exec chmod 755 {} \;
          VERSION="${GITHUB_REF_NAME#v}"
          dpkg-deb --build --root-owner-group pkgroot "tvhviewer_${VERSION}_all.deb"
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.ref_name }}
          path: |
            dist/${{ matrix.artifact_name }}.exe
            dist/${{ matrix.artifact_name }}-${{ github.ref_name }}-windows.zip
            dist/${{ matrix.artifact_name }}
            tvhviewer_*_all.deb
            tvhviewer-*-x86_64.AppImage
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TVHviewer ${{ github.ref_name }}"
          files: |
            dist/${{ matrix.artifact_name }}.exe
            dist/${{ matrix.artifact_name }}-${{ github.ref_name }}-windows.zip
            dist/${{ matrix.artifact_name }}
            tvhviewer_*_all.deb
            tvhviewer-*-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
